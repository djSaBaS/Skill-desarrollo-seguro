name: Validate Sabas Secure Development

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux bundle validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Report portable component hashes
        shell: bash
        run: |
          sha256sum \
            .github/workflows/validate.yml \
            README.md \
            INSTALL.md \
            ANTIGRAVITY.md \
            SECURITY.md \
            VSCODE.md \
            CHANGELOG.md \
            scripts/Setup-SabasSecureDev.ps1 \
            scripts/Uninstall-SabasSecureDev.ps1 \
            tests/Invoke-HermesInstallerSmoke.ps1 \
            tests/Invoke-UninstallerSmoke.ps1 \
            tests/test_portable_setup.py
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run portable self-test
        shell: pwsh
        run: ./scripts/Test-SabasSecureDev.ps1
      - name: Smoke selective Codex release install
        shell: pwsh
        run: |
          # Instala únicamente el control de prepublicación.
          ./scripts/Setup-SabasSecureDev.ps1 -Target Codex -Components Release
          # Obtiene la ruta global esperada del nuevo módulo.
          $releaseFile = Join-Path $HOME '.agents/skills/sabas-release-compliance/SKILL.md'
          # Confirma que el módulo solicitado existe realmente.
          if (-not (Test-Path $releaseFile)) { throw 'Release skill missing after install' }
          # No debe aparecer ninguna skill del módulo de seguridad no solicitado.
          if (Test-Path (Join-Path $HOME '.agents/skills/sabas-secure-qa/SKILL.md')) { throw 'Unexpected Security skill installed' }
          # Desinstala solo la revisión de prepublicación.
          ./scripts/Uninstall-SabasSecureDev.ps1 -Target Codex -Components Release
          # Confirma que se retiró el módulo seleccionado.
          if (Test-Path $releaseFile) { throw 'Release skill remained after uninstall' }

  windows:
    name: Windows PowerShell validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run bundle self-test
        shell: powershell
        run: .\scripts\Test-SabasSecureDev.ps1
      - name: Smoke selective Antigravity release install
        shell: powershell
        run: |
          # Instala únicamente la skill de lanzamiento en Antigravity.
          .\scripts\Setup-SabasSecureDev.ps1 -Target Antigravity -Components Release
          # Comprueba la ruta oficial usada por Antigravity IDE.
          $releaseFile = Join-Path $HOME '.gemini\config\skills\sabas-release-compliance\SKILL.md'
          # Exige la presencia de la skill solicitada.
          if (-not (Test-Path $releaseFile)) { throw 'Antigravity release skill missing' }
          # No debe haber ninguna skill de seguridad instalada por el flujo release-only.
          if (Test-Path (Join-Path $HOME '.gemini\config\skills\sabas-secure-qa\SKILL.md')) { throw 'Unexpected Antigravity Security skill' }
          # Retira el módulo recién instalado.
          .\scripts\Uninstall-SabasSecureDev.ps1 -Target Antigravity -Components Release
          # Verifica que la retirada no deja la skill activa.
          if (Test-Path $releaseFile) { throw 'Antigravity release skill remained' }
      - name: Run Hermes installer smoke test
        shell: powershell
        run: .\tests\Invoke-HermesInstallerSmoke.ps1
      - name: Run portable uninstaller smoke test
        shell: powershell
        run: .\tests\Invoke-UninstallerSmoke.ps1
